services:
  keywars:
    image: ${KEYWARS_IMAGE:-ghcr.io/adrianweidig/keywars}:${KEYWARS_VERSION:-latest}
    container_name: keywars
    restart: unless-stopped
    ports:
      - "${KEYWARS_BIND_ADDRESS:-0.0.0.0}:${KEYWARS_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      KEYWARS__DATA__DIRECTORY: /data
      KEYWARS__LDAP__URLS: ${KEYWARS_LDAP_URLS:?LDAP URLs required}
      KEYWARS__LDAP__BASE_DN: ${KEYWARS_LDAP_BASE_DN:?LDAP Base DN required}
      KEYWARS__LDAP__UPN_SUFFIX: ${KEYWARS_LDAP_UPN_SUFFIX:?LDAP UPN suffix required}
      KEYWARS__LDAP__USER_BASE_DN: ${KEYWARS_LDAP_USER_BASE_DN:-}
      KEYWARS__LDAP__CA_CERTIFICATE_PATH: ${KEYWARS_LDAP_CA_CERTIFICATE_PATH:-}
      KEYWARS__LDAP__ALLOW_STARTTLS: ${KEYWARS_LDAP_ALLOW_STARTTLS:-false}
      KEYWARS__LDAP__CONNECT_TIMEOUT_SECONDS: ${KEYWARS_LDAP_CONNECT_TIMEOUT_SECONDS:-5}
      KEYWARS__LDAP__OPERATION_TIMEOUT_SECONDS: ${KEYWARS_LDAP_OPERATION_TIMEOUT_SECONDS:-10}
      KEYWARS__PROXY__KNOWN_PROXIES: ${KEYWARS_PROXY_KNOWN_PROXIES:-}
      KEYWARS__PROXY__KNOWN_NETWORKS: ${KEYWARS_PROXY_KNOWN_NETWORKS:-}
      TZ: ${KEYWARS_TIME_ZONE:-Europe/Berlin}
      KEYWARS__CHALLENGES__MAX_PARTICIPANTS: ${KEYWARS_MAX_CHALLENGE_PARTICIPANTS:-64}
      KEYWARS__LIVE__MAX_PARTICIPANTS_PER_ROOM: ${KEYWARS_MAX_LIVE_PARTICIPANTS:-64}
      KEYWARS__LIVE__MAX_CONCURRENT_ROOMS: ${KEYWARS_MAX_LIVE_ROOMS:-200}
      KEYWARS__LIVE__MAX_CONNECTIONS_PER_USER: ${KEYWARS_MAX_CONNECTIONS_PER_USER:-3}
      KEYWARS__LIVE__PROGRESS_BROADCAST_HZ: ${KEYWARS_LIVE_BROADCAST_HZ:-10}
      KEYWARS__LIVE__COUNTDOWN_SECONDS: ${KEYWARS_LIVE_COUNTDOWN_SECONDS:-3}
      KEYWARS__LIVE__RECONNECT_GRACE_SECONDS: ${KEYWARS_LIVE_RECONNECT_SECONDS:-30}
      KEYWARS__LIVE__ROOM_COMMAND_QUEUE_CAPACITY: ${KEYWARS_LIVE_COMMAND_QUEUE_CAPACITY:-4096}
      KEYWARS__LIVE__COMPLETION_QUEUE_CAPACITY: ${KEYWARS_LIVE_COMPLETION_QUEUE_CAPACITY:-4096}
      KEYWARS__LIVE__COMPLETION_DRAIN_TIMEOUT_SECONDS: ${KEYWARS_LIVE_COMPLETION_DRAIN_TIMEOUT_SECONDS:-10}
      KEYWARS__LIVE__COMPLETED_ROOM_RETENTION_MINUTES: ${KEYWARS_LIVE_COMPLETED_ROOM_RETENTION_MINUTES:-60}
      KEYWARS__LIVE__LOBBY_ROOM_RETENTION_MINUTES: ${KEYWARS_LIVE_LOBBY_ROOM_RETENTION_MINUTES:-720}
      KEYWARS__LIVE__MAX_ARENA_TARGET_GRAPHEMES: ${KEYWARS_MAX_ARENA_TARGET_GRAPHEMES:-2800}
    volumes:
      - keywars-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "dotnet", "KeyWars.dll", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  keywars-data:
