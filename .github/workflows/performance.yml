name: performance

on:
  pull_request:
    paths:
      - ".github/workflows/performance.yml"
      - "src/KeyWars/**"
      - "tests/KeyWars.IntegrationTests/**"
      - "tests/cluster/**"
      - "tools/KeyWars.LoadTest/**"
      - "compose.scale.yaml"
      - "compose.test-cluster.yaml"
      - "Dockerfile"
      - "Directory.*.props"
      - "Directory.*.targets"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loadtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tools/KeyWars.LoadTest/KeyWars.LoadTest.csproj --locked-mode
      - name: Build
        run: dotnet build tools/KeyWars.LoadTest/KeyWars.LoadTest.csproj -c Release --no-restore
      - name: Load-tool self-tests
        run: dotnet tools/KeyWars.LoadTest/bin/Release/net10.0/KeyWars.LoadTest.dll --self-test
      - name: In-memory regression gate
        run: dotnet tools/KeyWars.LoadTest/bin/Release/net10.0/KeyWars.LoadTest.dll 2 25 64 | tee keywars-in-memory.txt
      - name: SignalR fan-out and SLO gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance-artifacts
          data_dir="${RUNNER_TEMP}/keywars-performance-${GITHUB_RUN_ID}"
          mkdir -p "${data_dir}"
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS=http://127.0.0.1:5191 \
          KEYWARS__AUTH__DEVELOPMENT_LOGIN=true \
          KEYWARS__DATA__DIRECTORY="${data_dir}" \
          KEYWARS__LIVE__COUNTDOWN_SECONDS=1 \
          KEYWARS__LIVE__PROGRESS_BROADCAST_HZ=20 \
          Logging__LogLevel__Default=Warning \
          Logging__LogLevel__Microsoft=Warning \
          dotnet src/KeyWars/bin/Release/net10.0/KeyWars.dll \
            >performance-artifacts/server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5191/health/ready >/dev/null; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat performance-artifacts/server.log
              exit 1
            fi
            if [[ "${attempt}" == "60" ]]; then
              cat performance-artifacts/server.log
              exit 1
            fi
            sleep 1
          done

          dotnet tools/KeyWars.LoadTest/bin/Release/net10.0/KeyWars.LoadTest.dll \
            --signalr \
            --scenario smoke \
            --base-url http://127.0.0.1:5191 \
            --rooms 2 \
            --participants 3 \
            --steps 10 \
            --typing-cps 5 \
            --jitter-ms 20 \
            --reconnect-percent 34 \
            --operation-timeout-ms 10000 \
            --timeout-seconds 180 \
            --target-process-id "${server_pid}" \
            --slo-p95-ms 2000 \
            --slo-p99-ms 5000 \
            --slo-fanout-p95-ms 3000 \
            --slo-error-rate-percent 0 \
            --slo-missing-broadcasts 0 \
            --json performance-artifacts/signalr-load.json \
            | tee performance-artifacts/signalr-load.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: keywars-performance-${{ github.run_id }}
          if-no-files-found: error
          path: |
            keywars-in-memory.txt
            performance-artifacts/

  scale-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build load client, PostgreSQL test and Redis Cluster contracts
        run: |
          dotnet restore tools/KeyWars.LoadTest/KeyWars.LoadTest.csproj --locked-mode
          dotnet build tools/KeyWars.LoadTest/KeyWars.LoadTest.csproj -c Release --no-restore
          dotnet restore tests/KeyWars.ConcurrencyTests/KeyWars.ConcurrencyTests.csproj --locked-mode
          dotnet build tests/KeyWars.ConcurrencyTests/KeyWars.ConcurrencyTests.csproj -c Release --no-restore
          dotnet restore tests/KeyWars.UnitTests/KeyWars.UnitTests.csproj --locked-mode
          dotnet build tests/KeyWars.UnitTests/KeyWars.UnitTests.csproj -c Release --no-restore
          dotnet restore tests/KeyWars.IntegrationTests/KeyWars.IntegrationTests.csproj --locked-mode
          dotnet build tests/KeyWars.IntegrationTests/KeyWars.IntegrationTests.csproj -c Release --no-restore
          dotnet restore tests/cluster/KeyWars.ClusterProbe/KeyWars.ClusterProbe.csproj --locked-mode
          dotnet build tests/cluster/KeyWars.ClusterProbe/KeyWars.ClusterProbe.csproj -c Release --no-restore
          dotnet test tests/KeyWars.UnitTests/KeyWars.UnitTests.csproj \
            -c Release --no-build --no-restore \
            --filter 'FullyQualifiedName~RedisClusterKeyspaceTests|FullyQualifiedName~RedisAttemptSessionStateStoreTests|FullyQualifiedName~RedisProfileAccessGate'
          dotnet test tests/KeyWars.ConcurrencyTests/KeyWars.ConcurrencyTests.csproj \
            -c Release --no-build --no-restore \
            --filter FullyQualifiedName~RedisLiveRoomDispatcherContractTests
      - name: Build local cluster image
        run: docker build --tag keywars:ci .
      - name: PostgreSQL, six-node Redis Cluster and replica failover
        shell: pwsh
        run: |
          ./tests/cluster/Invoke-ClusterHarness.ps1 `
            -Image keywars:ci `
            -SkipImageBuild `
            -SkipLoadBuild `
            -SoakSeconds 30 `
            -ArtifactDirectory (Join-Path $env:GITHUB_WORKSPACE 'scale-artifacts')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: keywars-redis-cluster-${{ github.run_id }}
          if-no-files-found: error
          path: scale-artifacts/
