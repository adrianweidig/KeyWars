name: quality

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            **/*.md
            !**/bin/**
            !**/obj/**

      - name: YAML lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: .github .github/workflows compose.yaml
          config_data: |
            extends: default
            rules:
              line-length:
                max: 140
                level: warning
              truthy:
                allowed-values: ['true', 'false', 'on']

      - name: GitHub Actions lint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Implementation status
        run: python scripts/check_implementation_status.py
