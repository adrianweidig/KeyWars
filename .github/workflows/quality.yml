name: quality

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !**/bin/**
            !**/obj/**

      - name: YAML lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: .github .github/workflows deploy compose.yaml compose.scale.yaml
          config_data: |
            extends: default
            rules:
              line-length:
                max: 140
                level: warning
              truthy:
                allowed-values: ['true', 'false', 'on']

      - name: GitHub Actions lint
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Implementation status
        run: python scripts/check_implementation_status.py

      - name: Deployment contracts
        run: python scripts/check_deployment_contracts.py

      - name: Kubernetes schema
        env:
          KUBECONFORM_VERSION: v0.7.0
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          KUBECTL_VERSION: v1.36.3
          KUBECTL_SHA256: ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          kubectl="$RUNNER_TEMP/kubectl"
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" kubeconform
          curl --fail --location --silent --show-error \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output "$kubectl"
          echo "${KUBECTL_SHA256}  ${kubectl}" | sha256sum --check --strict
          chmod +x "$kubectl"
          "$kubectl" kustomize deploy/k8s > "$RUNNER_TEMP/keywars-app.yaml"
          "$kubectl" kustomize deploy/k8s/cutover > "$RUNNER_TEMP/keywars-cutover.yaml"
          "$kubectl" kustomize deploy/k8s/migration > "$RUNNER_TEMP/keywars-migration.yaml"
          "$RUNNER_TEMP/kubeconform" -strict -summary \
            "$RUNNER_TEMP/keywars-app.yaml" "$RUNNER_TEMP/keywars-cutover.yaml" \
            "$RUNNER_TEMP/keywars-migration.yaml"
