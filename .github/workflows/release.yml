name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Implementation status
        run: python scripts/check_implementation_status.py
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: |
          for project in \
            tests/KeyWars.UnitTests/KeyWars.UnitTests.csproj \
            tests/KeyWars.IntegrationTests/KeyWars.IntegrationTests.csproj \
            tests/KeyWars.ConcurrencyTests/KeyWars.ConcurrencyTests.csproj \
            tests/KeyWars.E2ETests/KeyWars.E2ETests.csproj
          do
            dotnet test "$project" -c Release --no-build
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Verify visual assets
        run: npm run assets:verify
      - name: Browser E2E
        env:
          KEYWARS_BROWSER_CHANNEL: chrome
        run: npm run test:browser
      - name: Load test
        run: dotnet run --project tools/KeyWars.LoadTest -c Release --no-build -- 2 10 25 50 100
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/keywars
      - name: Build and push
        id: push-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Build offline amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: keywars:${{ github.ref_name }}
      - name: Create release notes
        env:
          IMAGE_DIGEST: ${{ steps.push-image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts
          docker save keywars:${{ github.ref_name }} | gzip -c > artifacts/keywars-${{ github.ref_name }}-linux-amd64.tar.gz
          cp compose.yaml .env.example artifacts/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          tags = [line for line in os.environ["IMAGE_TAGS"].splitlines() if line]
          manifest = {
              "schema_version": 1,
              "version": version,
              "release_notes": "RELEASE_NOTES.md",
              "image": {
                  "repository": "ghcr.io/${{ github.repository_owner }}/keywars",
                  "tags": tags,
                  "digest": os.environ["IMAGE_DIGEST"],
                  "sbom": "registry-attached",
                  "provenance": "registry-attached",
              },
              "offline_archives": [
                  {
                      "file": f"keywars-{version}-linux-amd64.tar.gz",
                      "platform": "linux/amd64",
                      "format": "docker-save-tar-gzip",
                  }
              ],
          }
          Path("artifacts/RELEASE_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section_header = f"## {version} "
          start = changelog.find(section_header)
          if start < 0:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          body_start = changelog.find("\n", start) + 1
          body_end = changelog.find("\n## ", body_start)
          if body_end < 0:
              body_end = len(changelog)
          changes = changelog[body_start:body_end].strip()
          if not changes:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")

          release_notes = f"""# KeyWars {version}

          {changes}

          ## Container

          - Repository: `ghcr.io/${{ github.repository_owner }}/keywars`
          - Tags: {', '.join(f'`{tag}`' for tag in tags)}
          - Multi-Arch-Digest: `{os.environ['IMAGE_DIGEST']}`
          - Plattformen: `linux/amd64`, `linux/arm64`
          - SBOM und Provenance: als Registry-Attestierungen veröffentlicht

          ## Release-Artefakte

          - Offline-Image für `linux/amd64`
          - `compose.yaml` und Beispielkonfiguration
          - `RELEASE_MANIFEST.json` mit Image-Digest und Tags
          - `SHA256SUMS` zur Integritätsprüfung
          """
          release_notes = "\n".join(line.strip() for line in release_notes.strip().splitlines()) + "\n"
          Path("artifacts/RELEASE_NOTES.md").write_text(release_notes, encoding="utf-8")
          PY
          (cd artifacts && sha256sum keywars-${{ github.ref_name }}-linux-amd64.tar.gz compose.yaml .env.example RELEASE_MANIFEST.json RELEASE_NOTES.md > SHA256SUMS)
      - name: Verify release artifacts
        run: python scripts/check_release_artifacts.py artifacts "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: artifacts/RELEASE_NOTES.md
          files: artifacts/*
