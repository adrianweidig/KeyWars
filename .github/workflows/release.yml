name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 35
    outputs:
      created: ${{ steps.release.outputs.created }}
      image_repository: ${{ steps.release.outputs.image_repository }}
      revision: ${{ steps.release.outputs.revision }}
      semver: ${{ steps.release.outputs.semver }}
      source_repository: ${{ steps.release.outputs.source_repository }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          release_semver="${GITHUB_REF_NAME#v}"
          repository_semver="$(tr -d '\r\n' < VERSION)"
          if [[ "$release_semver" != "$repository_semver" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION ($repository_semver)." >&2
            exit 1
          fi

          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "The release commit must be part of origin/master." >&2
            exit 1
          fi

          image_repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keywars"
          source_repository="https://github.com/${GITHUB_REPOSITORY}"
          {
            echo "created=$(git show -s --format=%cI "$GITHUB_SHA")"
            echo "image_repository=$image_repository"
            echo "revision=$GITHUB_SHA"
            echo "semver=$release_semver"
            echo "source_repository=$source_repository"
            echo "version=$GITHUB_REF_NAME"
          } >> "$GITHUB_OUTPUT"
      - name: Validate repository release metadata
        run: >-
          python scripts/prepare_release_artifacts.py
          --check-repository
          --expected-image-repository "${{ steps.release.outputs.image_repository }}"
      - name: Test release artifact contract
        run: python scripts/check_release_artifacts.py --self-test
      - name: Test published image contract
        run: python scripts/check_published_image.py --self-test
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Implementation status
        run: python scripts/check_implementation_status.py
      - name: Build
        env:
          RELEASE_SEMVER: ${{ steps.release.outputs.semver }}
        run: >-
          dotnet build -c Release --no-restore
          -p:Version="$RELEASE_SEMVER"
          -p:InformationalVersion="$RELEASE_SEMVER+$GITHUB_SHA"
          -p:SourceRevisionId="$GITHUB_SHA"
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:ContinuousIntegrationBuild=true
      - name: Test
        run: |
          for project in \
            tests/KeyWars.UnitTests/KeyWars.UnitTests.csproj \
            tests/KeyWars.IntegrationTests/KeyWars.IntegrationTests.csproj \
            tests/KeyWars.ConcurrencyTests/KeyWars.ConcurrencyTests.csproj \
            tests/KeyWars.E2ETests/KeyWars.E2ETests.csproj
          do
            dotnet test "$project" -c Release --no-build --no-restore
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Test visual asset URL policy
        run: npm run test:assets
      - name: Verify visual assets
        run: npm run assets:verify
      - name: Browser E2E
        env:
          KEYWARS_BROWSER_CHANNEL: chrome
        run: npm run test:browser
      - name: Load test
        run: dotnet run --project tools/KeyWars.LoadTest -c Release --no-build --no-restore -- 2 10 25 50 100

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify pinned external deployment images
        shell: bash
        run: |
          set -euo pipefail
          tail -n +2 deploy/images.txt | while IFS= read -r image; do
            if [[ -z "$image" || ! "$image" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid external image reference in deploy/images.txt: $image" >&2
              exit 1
            fi
            docker buildx imagetools inspect "$image" --raw > /dev/null
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.verify.outputs.image_repository }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest
      - name: Build and push multi-architecture image
        id: push-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ needs.verify.outputs.semver }}
            REVISION=${{ needs.verify.outputs.revision }}
            CREATED=${{ needs.verify.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Verify published multi-architecture image
        run: >-
          python scripts/check_published_image.py
          "${{ needs.verify.outputs.image_repository }}:${{ needs.verify.outputs.version }}"
          --digest "${{ steps.push-image.outputs.digest }}"
          --version "${{ needs.verify.outputs.version }}"
          --revision "${{ needs.verify.outputs.revision }}"
          --created "${{ needs.verify.outputs.created }}"
          --source-repository "${{ needs.verify.outputs.source_repository }}"
      - name: Create release artifacts from published image
        env:
          IMAGE_DIGEST: ${{ steps.push-image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ needs.verify.outputs.image_repository }}
          RELEASE_CREATED: ${{ needs.verify.outputs.created }}
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
          RELEASE_SOURCE: ${{ needs.verify.outputs.source_repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}:${RELEASE_VERSION}"
          canonical_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          mkdir -p artifacts

          docker buildx imagetools inspect "$canonical_ref" \
            --format '{{ json (index .SBOM "linux/amd64").SPDX }}' \
            > artifacts/SBOM-linux-amd64.spdx.json
          docker buildx imagetools inspect "$canonical_ref" \
            --format '{{ json (index .SBOM "linux/arm64").SPDX }}' \
            > artifacts/SBOM-linux-arm64.spdx.json
          docker pull --platform linux/amd64 "$image_ref"
          docker save "$image_ref" | gzip -n -9 > "artifacts/keywars-${RELEASE_VERSION}-linux-amd64.tar.gz"
          cp compose.yaml artifacts/
          cp compose.scale.yaml artifacts/
          cp .env.example artifacts/default.env.example
          cp .env.scale.example artifacts/scale.env.example
          cp docs/airgap-install.md artifacts/AIRGAP_INSTALL.md
          cp docs/scale-operations.md artifacts/SCALE_OPERATIONS.md

          python scripts/prepare_release_artifacts.py \
            --artifact-dir artifacts \
            --version "$RELEASE_VERSION" \
            --image-repository "$IMAGE_REPOSITORY" \
            --image-digest "$IMAGE_DIGEST" \
            --revision "$RELEASE_REVISION" \
            --created "$RELEASE_CREATED" \
            --source-repository "$RELEASE_SOURCE"
      - name: Verify release artifacts before publication
        run: >-
          python scripts/check_release_artifacts.py
          artifacts "${{ needs.verify.outputs.version }}"
          --expected-revision "${{ needs.verify.outputs.revision }}"
          --expected-created "${{ needs.verify.outputs.created }}"
          --expected-source "${{ needs.verify.outputs.source_repository }}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: artifacts/RELEASE_NOTES.md
          draft: false
          fail_on_unmatched_files: true
          files: artifacts/*
          make_latest: true
          name: KeyWars ${{ needs.verify.outputs.version }}
          prerelease: false
          tag_name: ${{ needs.verify.outputs.version }}
          target_commitish: ${{ needs.verify.outputs.revision }}
      - name: Verify published release metadata and asset inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_info="$(gh release view "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq '[.tagName, (.isDraft | tostring), (.isPrerelease | tostring)] | @tsv')"
          IFS=$'\t' read -r tag_name is_draft is_prerelease <<< "$release_info"
          if [[ "$tag_name" != "$RELEASE_VERSION" || "$is_draft" != "false" || \
                "$is_prerelease" != "false" ]]; then
            echo "Published release metadata does not describe the verified stable tag." >&2
            exit 1
          fi

          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" \
            --jq '[.object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r tag_type tag_sha <<< "$tag_object"
          if [[ "$tag_type" == "tag" ]]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
              --jq '[.object.type, .object.sha] | @tsv')"
            IFS=$'\t' read -r tag_type tag_sha <<< "$tag_object"
          fi
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$RELEASE_REVISION" ]]; then
            echo "Published release tag does not resolve to $RELEASE_REVISION." >&2
            exit 1
          fi

          archive="keywars-${RELEASE_VERSION}-linux-amd64.tar.gz"
          bundle="keywars-${RELEASE_VERSION}-deployment-bundle.zip"
          if ! diff -u \
            <(printf '%s\n' \
              AIRGAP_INSTALL.md \
              RELEASE_MANIFEST.json \
              RELEASE_NOTES.md \
              SBOM-linux-amd64.spdx.json \
              SBOM-linux-arm64.spdx.json \
              SHA256SUMS \
              compose.yaml \
              compose.scale.yaml \
              default.env.example \
              scale.env.example \
              SCALE_OPERATIONS.md \
              "$bundle" \
              "$archive" | sort) \
            <(gh release view "$RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' | sort); then
            echo "Published release asset inventory differs from the expected public set." >&2
            exit 1
          fi
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir published-artifacts
          gh release download "${{ needs.verify.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published-artifacts
      - name: Verify published release assets
        run: >-
          python scripts/check_release_artifacts.py
          published-artifacts "${{ needs.verify.outputs.version }}"
          --expected-revision "${{ needs.verify.outputs.revision }}"
          --expected-created "${{ needs.verify.outputs.created }}"
          --expected-source "${{ needs.verify.outputs.source_repository }}"
