version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      nuget-updates:
        patterns:
          - "*"
    labels:
      - dependencies
      - dotnet
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      github-actions-updates:
        patterns:
          - "*"
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      docker-updates:
        patterns:
          - "*"
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: docker

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      npm-updates:
        patterns:
          - "*"
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: deps
