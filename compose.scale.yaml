---
name: keywars-scale

x-keywars-image: &keywars-image
  image: ${KEYWARS_IMAGE:-ghcr.io/adrianweidig/keywars}:${KEYWARS_VERSION:-v0.5.0}

x-keywars-environment: &keywars-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  KEYWARS__DATABASE__PROVIDER: postgresql
  KEYWARS__DATAPROTECTION__APPLICATION_NAME: KeyWars
  KEYWARS__LDAP__URLS: ${KEYWARS_LDAP_URLS:?LDAP URLs required}
  KEYWARS__LDAP__BASE_DN: ${KEYWARS_LDAP_BASE_DN:?LDAP Base DN required}
  KEYWARS__LDAP__UPN_SUFFIX: ${KEYWARS_LDAP_UPN_SUFFIX:?LDAP UPN suffix required}
  KEYWARS__LDAP__USER_BASE_DN: ${KEYWARS_LDAP_USER_BASE_DN:-}
  KEYWARS__LDAP__CA_CERTIFICATE_PATH: /etc/keywars/ldap-ca.crt
  KEYWARS__LDAP__ALLOW_STARTTLS: ${KEYWARS_LDAP_ALLOW_STARTTLS:-false}
  KEYWARS__MODERATION__MODERATOR_GROUP_DNS: ${KEYWARS_MODERATOR_GROUP_DNS:-}
  KEYWARS__MODERATION__MODERATOR_GROUP_VALUES: ${KEYWARS_MODERATOR_GROUP_VALUES:-}
  KEYWARS__PROXY__KNOWN_NETWORKS: ${KEYWARS_PROXY_KNOWN_NETWORKS:-172.16.0.0/12}
  KEYWARS__LIVE__MAX_PARTICIPANTS_PER_ROOM: ${KEYWARS_MAX_LIVE_PARTICIPANTS:-64}
  KEYWARS__LIVE__MAX_CONCURRENT_ROOMS: ${KEYWARS_MAX_LIVE_ROOMS:-200}
  KEYWARS__LIVE__MAX_CONNECTIONS_PER_USER: ${KEYWARS_MAX_CONNECTIONS_PER_USER:-3}
  KEYWARS__LIVE__PROGRESS_BROADCAST_HZ: ${KEYWARS_LIVE_BROADCAST_HZ:-10}
  KEYWARS__RETENTION__ENABLED: ${KEYWARS_RETENTION_ENABLED:-false}
  KEYWARS__RETENTION__DRY_RUN: ${KEYWARS_RETENTION_DRY_RUN:-true}
  KEYWARS__RETENTION__INTERVAL_HOURS: ${KEYWARS_RETENTION_INTERVAL_HOURS:-24}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  TZ: ${KEYWARS_TIME_ZONE:-Europe/Berlin}

x-keywars-service: &keywars-service
  <<: *keywars-image
  entrypoint: ["/bin/sh", "-ec"]
  command:
    - |
      export ConnectionStrings__KeyWars="$$(cat /run/secrets/database-connection)"
      export KEYWARS__REDIS__CONNECTION_STRING="$$(cat /run/secrets/redis-connection)"
      exec dotnet KeyWars.dll
  environment: *keywars-environment
  secrets:
    - database-connection
    - redis-connection
  volumes:
    - type: bind
      source: ${KEYWARS_LDAP_CA_FILE:-./secrets/ldap-ca.crt}
      target: /etc/keywars/ldap-ca.crt
      read_only: true
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  stop_grace_period: 60s
  healthcheck:
    test: ["CMD", "dotnet", "KeyWars.dll", "healthcheck"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  keywars-edge:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "${KEYWARS_BIND_ADDRESS:-127.0.0.1}:${KEYWARS_PORT:-8080}:8080"
    volumes:
      - ./deploy/swarm/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /data:size=16m,mode=1777,noexec,nosuid,nodev
      - /config:size=16m,mode=1777,noexec,nosuid,nodev
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    depends_on:
      keywars-web:
        condition: service_healthy
      keywars-arena:
        condition: service_healthy

  keywars-web:
    <<: *keywars-service
    environment:
      <<: *keywars-environment
      KEYWARS__RUNTIME__ROLE: web
    networks: [frontend, backend]
    deploy:
      replicas: ${KEYWARS_WEB_REPLICAS:-2}

  keywars-arena:
    <<: *keywars-service
    environment:
      <<: *keywars-environment
      KEYWARS__RUNTIME__ROLE: arena
    networks: [frontend, backend]
    deploy:
      replicas: ${KEYWARS_ARENA_REPLICAS:-2}

  keywars-worker:
    <<: *keywars-service
    environment:
      <<: *keywars-environment
      KEYWARS__RUNTIME__ROLE: worker
    deploy:
      replicas: ${KEYWARS_WORKER_REPLICAS:-1}

  keywars-migrate:
    <<: *keywars-service
    environment:
      <<: *keywars-environment
      KEYWARS__RUNTIME__ROLE: migrate
    healthcheck:
      disable: true
    restart: "no"

  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: keywars
      POSTGRES_USER: keywars
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keywars -d keywars"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    stop_grace_period: 120s

  redis:
    image: redis:8.6.5-alpine@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    stop_grace_period: 60s

secrets:
  postgres-password:
    file: ${KEYWARS_SECRETS_DIRECTORY:-./secrets}/postgres-password
  database-connection:
    file: ${KEYWARS_SECRETS_DIRECTORY:-./secrets}/database-connection
  redis-connection:
    file: ${KEYWARS_SECRETS_DIRECTORY:-./secrets}/redis-connection

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
