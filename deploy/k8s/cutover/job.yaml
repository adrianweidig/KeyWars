---
apiVersion: batch/v1
kind: Job
metadata:
  name: keywars-protocol-cutover
  labels:
    app.kubernetes.io/name: keywars
    app.kubernetes.io/component: protocol-cutover
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keywars
        app.kubernetes.io/component: protocol-cutover
        app.kubernetes.io/part-of: keywars
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: protocol-cutover
          image: ghcr.io/adrianweidig/keywars:v0.5.0
          args:
            - maintenance
            - cluster-protocol
            - cutover
            - --confirm-apps-stopped
          envFrom:
            - configMapRef:
                name: keywars-runtime-config
          env:
            - name: KEYWARS__RUNTIME__ROLE
              value: migrate
            - name: ConnectionStrings__KeyWars
              valueFrom:
                secretKeyRef:
                  name: keywars-database-connection
                  key: connection-string
            - name: KEYWARS__REDIS__CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: keywars-redis-connection
                  key: connection-string
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
