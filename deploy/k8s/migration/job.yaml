---
apiVersion: batch/v1
kind: Job
metadata:
  name: keywars-migrate
  labels:
    app.kubernetes.io/name: keywars
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keywars
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: keywars
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/adrianweidig/keywars:v0.5.0
          envFrom:
            - configMapRef:
                name: keywars-runtime-config
            - configMapRef:
                name: keywars-site-config
          env:
            - name: KEYWARS__RUNTIME__ROLE
              value: migrate
            - name: ConnectionStrings__KeyWars
              valueFrom:
                secretKeyRef:
                  name: keywars-database-connection
                  key: connection-string
            - name: KEYWARS__REDIS__CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: keywars-redis-connection
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ldap-ca
              mountPath: /etc/keywars/ldap-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: ldap-ca
          configMap:
            name: keywars-ldap-ca
            optional: true
